services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      # FIDEL_BIND=127.0.0.1 on a server behind a web server (only reachable through it).
      - "${FIDEL_BIND:-0.0.0.0}:${FIDEL_PORT:-8000}:8000"
    # Optional settings file. Copy .env.example to .env to set the staff token.
    env_file:
      - path: .env
        required: false
    volumes:
      # Runtime files (lessons, models, demo media) live on the host, git-ignored.
      - ./data:/app/data
      # ALX's Savanna starter pages with Fidel added: sh scripts/setup-savanna.sh
      - ./savanna:/app/savanna:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  kozha:
    build:
      context: .
      dockerfile: Dockerfile.kozha
    ports:
      - "${KOZHA_BIND:-127.0.0.1}:${KOZHA_PORT:-8001}:8000"
    volumes:
      # Fidel sign-language frame files (BSL frame + EthSL frame + EthSL sign images)
      - ./kozha-integration:/app/public/fidel-sign:ro
      # EthSL sign gesture images (Mendeley dataset 10.17632/5d3nkyhsrf.1, CC BY 4.0)
      # Place extracted dataset images as: ./data/ethasl-public/ethasl/fingerspelling/SIGN.jpg
      # SVG placeholders are pre-generated in kozha-integration/ethasl/fingerspelling/
      - ./data/ethasl-public/ethasl:/app/public/data/ethasl:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/chat2hamnosys/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
