services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "${FIDEL_PORT:-8000}:8000"   # change the port with FIDEL_PORT in .env
    # Optional settings file. Copy .env.example to .env to set the staff token.
    env_file:
      - path: .env
        required: false
    volumes:
      # Runtime files (lessons, models, demo media) live on the host, git-ignored.
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
