<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lesson – Savanna (mock)</title>

  <!-- Fidel install: these two lines plus the <fidel-player> tag below. -->
  <link rel="stylesheet" href="/embed/v1/fidel.css">
  <link rel="stylesheet" href="savanna.css">
  <script src="/embed/v1/fidel.js" defer></script>
</head>
<body class="mock-shell">
  <a class="skip-link" href="#main">Skip to lesson</a>
  <header><a class="brand" href="/demo/savanna-mock/">Savanna <span>(mock)</span></a></header>
  <main id="main" tabindex="-1">
    <h1 id="lesson-title">Lesson</h1>
    <section class="card" aria-labelledby="video-heading">
      <h2 id="video-heading">Lesson video</h2>
      <div id="player-slot"></div>
    </section>
  </main>

  <!-- Mock-page glue only: picks the lesson from the address, e.g.
       lesson.html?id=0123456789ab. A real platform would write the tag
       <fidel-player lesson="https://FIDEL-HOST/api/v1/lessons/ID"> directly. -->
  <script>
    const id = new URLSearchParams(location.search).get('id') || '';
    const slot = document.getElementById('player-slot');
    if (/^[a-f0-9]{12}$/.test(id)) {
      const player = document.createElement('fidel-player');
      player.id = 'lesson-player';
      player.setAttribute('lesson', '/api/v1/lessons/' + id);
      slot.append(player);
      fetch('/api/v1/lessons/' + id).then((r) => r.ok && r.json()).then((lesson) => {
        if (lesson) {
          document.getElementById('lesson-title').textContent = lesson.title;
          document.title = lesson.title + ' – Savanna (mock)';
        }
      });
    } else {
      slot.textContent = 'No lesson chosen. Add ?id=LESSON_ID to the address.';
    }
  </script>
</body>
</html>
