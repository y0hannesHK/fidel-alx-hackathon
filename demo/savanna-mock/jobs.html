<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jobs – Savanna (mock)</title>

  <!-- Fidel install: same two lines as for the player. -->
  <link rel="stylesheet" href="/embed/v1/fidel.css">
  <script src="/embed/v1/fidel.js" defer></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5; color: #1a1a1a; background: #f5f6f8; }
    a { color: #0b4f9c; }
    :focus-visible { outline: 3px solid #0b4f9c; outline-offset: 2px; }
    .skip-link { position: absolute; left: 0.5rem; top: -4rem; padding: 0.75rem 1rem; background: #fff; z-index: 10; }
    .skip-link:focus { top: 0.5rem; }
    header { background: #0a1f44; color: #fff; padding: 0.75rem 1rem; display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem; align-items: center; }
    header .brand { font-weight: 700; font-size: 1.25rem; color: #fff; text-decoration: none; }
    header nav ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0.25rem 1rem; }
    header nav a { color: #fff; display: inline-block; padding: 0.5rem 0; }
    main { max-width: 960px; margin: 0 auto; padding: 1rem; }
    h1 { font-size: 1.75rem; line-height: 1.25; }
    .jobs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1rem; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to jobs</a>
  <header>
    <a class="brand" href="/demo/savanna-mock/">Savanna <span>(mock)</span></a>
    <nav aria-label="Main">
      <ul>
        <li><a href="/demo/savanna-mock/">Lesson</a></li>
        <li><a href="/demo/savanna-mock/jobs.html" aria-current="page">Jobs</a></li>
        <li><a href="/demo/savanna-mock/session.html">Recorded session</a></li>
      </ul>
    </nav>
  </header>
  <main id="main" tabindex="-1">
    <h1>Jobs for Digital Bridge learners</h1>
    <p id="intro">Open jobs from employers who welcome learners with disabilities, refugees and returnees.</p>
    <ul class="jobs" id="jobs"></ul>
  </main>

  <!-- Mock-page glue only: list open jobs from the Fidel API and show a card
       for each. A real platform writes <fidel-job-card job="..."> directly. -->
  <script>
    const list = document.getElementById('jobs');
    const only = new URLSearchParams(location.search).get('id');
    fetch('/api/v1/jobs').then((r) => r.json()).then((jobs) => {
      const shown = only ? jobs.filter((j) => j.id === only) : jobs;
      if (!shown.length) {
        list.outerHTML = '<p>No open jobs right now.</p>';
        return;
      }
      for (const job of shown) {
        const item = document.createElement('li');
        const card = document.createElement('fidel-job-card');
        card.setAttribute('job', job.url);
        card.setAttribute('heading-level', '2');
        item.append(card);
        list.append(item);
      }
    });
  </script>
</body>
</html>
