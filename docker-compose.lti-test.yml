# A Moodle on this computer, only for testing Fidel's LTI 1.3 (README, "LTI 1.3";
# docs/manual-testing.md, "LTI"). Not part of Fidel's install.
#
#   docker compose -f docker-compose.lti-test.yml up -d     first start: a few minutes
#   sh scripts/moodle-test-setup.sh                         course, student, network settings
#   docker compose -f docker-compose.lti-test.yml down -v   remove it all again
#
# Moodle is at http://host.docker.internal:8081 (admin / Admin-1234!). The same
# address works from the browser, from Moodle's container and from Fidel's, which
# LTI needs: both sides compare addresses exactly.
#
# The images are Bitnami's "legacy" Moodle 4.5 LTS images: they get no security
# updates any more. Fine on a laptop for a test; never use them for a real Moodle.
name: fidel-lti-test

services:
  moodle-db:
    image: bitnamilegacy/mariadb:11.4
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
      MARIADB_USER: bn_moodle
      MARIADB_DATABASE: bitnami_moodle
      MARIADB_CHARACTER_SET: utf8mb4
      MARIADB_COLLATE: utf8mb4_unicode_ci
    volumes:
      - moodle-db:/bitnami/mariadb

  moodle:
    image: bitnamilegacy/moodle:4.5
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      MOODLE_DATABASE_TYPE: mariadb
      MOODLE_DATABASE_HOST: moodle-db
      MOODLE_DATABASE_PORT_NUMBER: "3306"
      MOODLE_DATABASE_USER: bn_moodle
      MOODLE_DATABASE_NAME: bitnami_moodle
      ALLOW_EMPTY_PASSWORD: "yes"
      MOODLE_USERNAME: admin
      MOODLE_PASSWORD: Admin-1234!
      MOODLE_EMAIL: admin@example.org
      MOODLE_SITE_NAME: Fidel LTI test
      MOODLE_HOST: host.docker.internal:8081
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - moodle:/bitnami/moodle
      - moodledata:/bitnami/moodledata
    depends_on:
      - moodle-db

volumes:
  moodle-db:
  moodle:
  moodledata:
